name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -5

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: CGO_ENABLED=0 go build -o bin/agentd ./cmd/agentd
      - name: Smoke test binary
        run: |
          ./bin/agentd &
          PID=$!
          for i in {1..10}; do
            if curl -sf http://localhost:7700/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:7700/healthz | grep -q '"status":"ok"'
          curl -sf http://localhost:7700/readyz | grep -q '"status":"ready"'
          curl -sf http://localhost:7700/v1/version | grep -q '"api":"v1"'
          curl -sf http://localhost:7700/metrics | grep -q "agentd_build_info"
          kill "$PID"
          wait "$PID" 2>/dev/null || true
      - name: Build container image
        run: docker build -t agentd:ci .

  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Lint example agent
        run: ruff check ../../examples && ruff format --check ../../examples
      - name: pytest (against a real agentd binary and Docker sandbox)
        env:
          AGENTD_DOCKER_TESTS: "1"
        run: pytest -q

  docker-integration:
    name: Docker sandbox integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Sandbox tests against the runner's Docker daemon
        env:
          AGENTD_DOCKER_TESTS: "1"
        run: go test -count=1 -run TestDockerIntegration -v ./internal/sandbox/

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Lint and render every sandbox mode
        run: |
          helm lint deploy/helm/agentd
          for mode in dind hostSocket none; do
            helm template t deploy/helm/agentd --set sandbox.mode=$mode > /dev/null
          done
          helm template t deploy/helm/agentd --set sandbox.mode=external \
            --set sandbox.external.dockerHost=tcp://sandbox:2375 > /dev/null

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The CLI scans full history; the action's push-range scan is empty on new branches.
      - name: Gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1
