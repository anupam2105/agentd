# Local demo: agentd + Jaeger (traces) + Prometheus + Grafana.
#
#   just demo-up          # or: docker compose -f deploy/docker-compose.yml up -d --build
#   just demo-agent       # run examples/sre_agent.py against it
#
# agentd:      http://localhost:7700   (API token: demo-token)
# Jaeger UI:   http://localhost:26686
# Prometheus:  http://localhost:29090
# Grafana:     http://localhost:23000  (anonymous admin, demo only)
#
# agentd starts tool containers through the host's Docker socket. Anything with
# access to that socket is root-equivalent on the host. This is fine for a local
# demo; see SECURITY.md before doing it anywhere else.
name: agentd-demo

services:
  agentd:
    build:
      context: ..
      args:
        BUILD_VERSION: demo
    image: agentd:demo
    user: "0:0" # to open /var/run/docker.sock
    ports:
      - "7700:7700"
    environment:
      AGENTD_CONFIG: /etc/agentd/agentd.yaml
      AGENTD_API_TOKEN: demo-token
      AGENTD_PUBLIC_URL: http://localhost:7700
      AGENTD_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENTD_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENTD_SLACK_WEBHOOK_URL: ${AGENTD_SLACK_WEBHOOK_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: agentd
      LOG_LEVEL: info
    volumes:
      - ../agentd.example.yaml:/etc/agentd/agentd.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - agentd-data:/data
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "26686:16686"

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "29090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "23000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agentd.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger

volumes:
  agentd-data:
